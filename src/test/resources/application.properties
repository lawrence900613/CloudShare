spring.datasource.url=jdbc:h2:mem:fileshare-test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.sql.init.mode=never
app.jwt.secret=test-secret-for-ci-only-which-is-at-least-thirty-two-bytes
app.jwt.ttlMinutes=60
app.aws.region=us-west-2
app.aws.s3.bucket=test-bucket
app.aws.access-key=test-access-key
app.aws.secret-key=test-secret-key
app.mail.enabled=false
