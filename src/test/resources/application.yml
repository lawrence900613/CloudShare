spring:
  mail:
    host: localhost
    port: 2525
    username: test@example.com
    password: test-password
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false
  datasource:
    url: jdbc:h2:mem:fileshare-test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driverClassName: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  sql:
    init:
      mode: never
  h2:
    console:
      enabled: false

app:
  jwt:
    secret: test-secret-for-ci-only-which-is-at-least-thirty-two-bytes
    ttlMinutes: 60
  aws:
    region: us-west-2
    s3:
      bucket: test-bucket
      presign-put-ttl-minutes: 10
    access-key: test-access-key
    secret-key: test-secret-key
  files:
    max-per-user: 5
  public-base-url: http://localhost:8080
  verification:
    base-url: http://localhost:5173
    token-ttl-minutes: 30
  password-reset:
    base-url: http://localhost:5173
    token-ttl-minutes: 30
  cors:
    allowed-origins: http://localhost:3000,http://localhost:5173,http://localhost:5174,http://127.0.0.1:5173
