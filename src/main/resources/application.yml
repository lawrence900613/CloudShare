spring:
  application:
    name: FileShare
  config:
    import: optional:file:./application-secrets.properties
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/fileshare}
    driverClassName: ${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    defer-datasource-initialization: true
  sql:
    init:
      mode: always
  h2:
    console:
      enabled: true
      path: /h2-console

app:
  jwt:
    secret: CHANGE_ME_WITH_A_LONG_RANDOM_SECRET
    ttlMinutes: 60
  aws:
    region: us-west-2
    s3:
      bucket: replace-it
      presign-put-ttl-minutes: ${APP_AWS_S3_PRESIGN_PUT_TTL_MINUTES:10}
    access-key: replace-it
    secret-key: replace-it
  files:
    max-per-user: ${APP_FILES_MAX_PER_USER:5}
  public-base-url: ${APP_PUBLIC_BASE_URL:http://localhost:8080}
  verification:
    base-url: ${APP_VERIFICATION_BASE_URL:http://localhost:5173}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://127.0.0.1:5173}
  mail:
    enabled: ${APP_MAIL_ENABLED:false}
    from: ${APP_MAIL_FROM:no-reply@fileshare.local}

server:
  forward-headers-strategy: framework
