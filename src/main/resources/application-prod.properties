spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.driverClassName=${SPRING_DATASOURCE_DRIVER_CLASS_NAME}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

spring.jpa.show-sql=false
spring.sql.init.mode=never

spring.h2.console.enabled=false

app.jwt.secret=${APP_JWT_SECRET}
app.aws.s3.bucket=${APP_AWS_S3_BUCKET}
app.aws.access-key=${APP_AWS_ACCESS_KEY}
app.aws.secret-key=${APP_AWS_SECRET_KEY}
app.public-base-url=${APP_PUBLIC_BASE_URL}
app.verification.base-url=${APP_VERIFICATION_BASE_URL}
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS}
