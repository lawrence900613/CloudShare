spring.application.name=FileShare
app.jwt.secret=8f7a2c3d9e1b4a6f0c5d8e2f1a3b7c9d4e6f8a1b2c3d5e7f9a0b1c2d3e4f6a8b
app.jwt.ttlMinutes=60

# Embedded database (H2)
spring.datasource.url=jdbc:h2:file:./data/fileshare
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# H2 web console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# AWS S3
app.aws.region=us-west-2
app.aws.s3.bucket=cloudsharetest
app.aws.access-key=AKIAQRPJY34SQAJMMCGC
app.aws.secret-key=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

# Max files per user (environment override: APP_FILES_MAX_PER_USER)
app.files.max-per-user=${APP_FILES_MAX_PER_USER:5}
app.public-base-url=${APP_PUBLIC_BASE_URL:http://localhost:8080}
app.verification.base-url=${APP_VERIFICATION_BASE_URL:http://localhost:5173}
app.mail.enabled=${APP_MAIL_ENABLED:false}
app.mail.from=${APP_MAIL_FROM:no-reply@fileshare.local}
spring.mail.host=${SPRING_MAIL_HOST:}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SPRING_MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SPRING_MAIL_SMTP_STARTTLS:true}
server.forward-headers-strategy=framework
