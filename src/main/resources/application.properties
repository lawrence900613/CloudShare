spring.application.name=FileShare
spring.config.import=optional:file:./application-secrets.properties
app.jwt.secret=CHANGE_ME_WITH_A_LONG_RANDOM_SECRET
app.jwt.ttlMinutes=60

# Database (defaults to H2 locally; override with SPRING_DATASOURCE_* in AWS)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/fileshare}
spring.datasource.driverClassName=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# H2 web console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# AWS S3
app.aws.region=us-west-2
app.aws.s3.bucket=replace-it
app.aws.access-key=replace-it
app.aws.secret-key=replace-it
app.aws.s3.presign-put-ttl-minutes=${APP_AWS_S3_PRESIGN_PUT_TTL_MINUTES:10}

# Max files per user (environment override: APP_FILES_MAX_PER_USER)
app.files.max-per-user=${APP_FILES_MAX_PER_USER:5}
app.public-base-url=${APP_PUBLIC_BASE_URL:http://localhost:8080}
app.verification.base-url=${APP_VERIFICATION_BASE_URL:http://localhost:5173}
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://127.0.0.1:5173}
app.mail.enabled=${APP_MAIL_ENABLED:false}
app.mail.from=${APP_MAIL_FROM:no-reply@fileshare.local}
server.forward-headers-strategy=framework
