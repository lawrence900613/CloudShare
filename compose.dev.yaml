services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: fileshare
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    image: eclipse-temurin:18-jdk
    working_dir: /workspace
    depends_on:
      - db
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/fileshare
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-postgres}
      APP_JWT_SECRET: ${APP_JWT_SECRET:-dev-secret-key-at-least-32-chars-long}
      APP_AWS_S3_BUCKET: ${APP_AWS_S3_BUCKET}
      APP_AWS_ACCESS_KEY: ${APP_AWS_ACCESS_KEY}
      APP_AWS_SECRET_KEY: ${APP_AWS_SECRET_KEY}
      APP_AWS_REGION: us-west-2
      APP_PUBLIC_BASE_URL: http://localhost:8080
      APP_VERIFICATION_BASE_URL: http://localhost:5173
      APP_PASSWORD_RESET_BASE_URL: http://localhost:5173
      APP_CORS_ALLOWED_ORIGINS: http://localhost:5173
      SPRING_MAIL_HOST: smtp.gmail.com
      SPRING_MAIL_PORT: 587
      SPRING_MAIL_USERNAME: ${SPRING_MAIL_USERNAME}
      SPRING_MAIL_PASSWORD: ${SPRING_MAIL_PASSWORD}
      SPRING_MAIL_SMTP_AUTH: "true"
      SPRING_MAIL_SMTP_STARTTLS_ENABLE: "true"
    volumes:
      - .:/workspace
      - gradle_cache:/root/.gradle
    command: sh -c "chmod +x ./gradlew && ./gradlew bootRun --continuous --no-daemon"

  frontend:
    image: node:20-alpine
    working_dir: /app
    depends_on:
      - backend
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE_URL: http://localhost:8080
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0 --port 5173"

volumes:
  pgdata:
  gradle_cache:
  frontend_node_modules:
